[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc = "0.8.28"
optimizer = true
optimizer_runs = 200
evm_version = "cancun"
fs_permissions = [{ access = "read", path = "../artifacts" }]

[lint]
exclude_lints = ["screaming-snake-case-const", "mixed-case-variable", "unsafe-cheatcode", "screaming-snake-case-immutable"]

[rpc_endpoints]
anvil = "http://127.0.0.1:8545"
